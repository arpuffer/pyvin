name: Pyvin post commit steps
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked pylint src/pyvin
      - run: uv run --locked flake8 src/pyvin
      - run: uv run --locked mypy src/pyvin
      - name: Unit tests
        run: uv run --locked pytest --cov=src/pyvin --cov-fail-under=92 tests/unit/ -vv
      - run: uv build
