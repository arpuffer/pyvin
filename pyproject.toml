[project]
name = "pyvin"
version = "0.0.3"
description = "Python VIN decoder"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alex Puffer" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.32.3,<3", "retry>=0.9.2,<0.10"]

[project.urls]
Homepage = "https://github.com/arpuffer/pyvin"

[dependency-groups]
dev = [
    "flake8>=7.1,<8",
    "mypy>=1.15,<2",
    "pylint>=3.3,<5",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "types-requests",
    "types-retry",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

